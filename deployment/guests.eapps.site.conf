# =============================================================================
# nginx — web host (Next.js). Install to
# /etc/nginx/sites-available/guests.eapps.site.conf and symlink
# into sites-enabled. Serves guests.eapps.site; paths assume
# APP_DIR=/home/michael/apps/guests.
#
# www.guests.eapps.site (on the app's certificate) 301s here on both HTTP and HTTPS — never
# proxy www, or CORS_ORIGIN / CSRF / the session cookie's Domain / canonicals see a second
# web origin.
#
# nginx proxies HTML to Node and serves only the hashed build assets and the sheet fonts off disk.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name guests.eapps.site;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.guests.eapps.site;

    location / {
        return 301 https://guests.eapps.site$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.guests.eapps.site;

    ssl_certificate     /etc/letsencrypt/live/guests.eapps.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guests.eapps.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://guests.eapps.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guests.eapps.site;

    ssl_certificate     /etc/letsencrypt/live/guests.eapps.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guests.eapps.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Hashed, immutable build assets, served straight off disk. The path runs through
    # web/current, so a release swap is picked up with no nginx reload.
    location /_next/static/ {
        alias /home/michael/apps/guests/web/current/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The sheet typefaces (public/fonts). A file never changes under the same path —
    # scripts/fonts rewrites the folder — which is the same promise next.config.ts makes.
    location /fonts/ {
        alias /home/michael/apps/guests/web/current/public/fonts/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /_next/image is the image optimizer, not a static path. It is deliberately NOT
    # matched above so it falls through to Node.

    location / {
        proxy_pass http://127.0.0.1:7010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next streams RSC payloads; buffering them defeats every Suspense boundary and
        # delays first paint until the whole render finishes.
        proxy_buffering off;

        # NEVER add proxy_cache to this block. src/proxy.ts answers /dashboard and /account
        # by the visitor's cookies (a sign-in redirect, or the page) — caching that would serve
        # one visitor's answer to the next. Next caches its static pages itself.

        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml application/manifest+json image/svg+xml;
    gzip_min_length 256;
}
